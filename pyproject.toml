[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jev-gc"
version = "0.1.0"
description = "Real-time OpenTelemetry-based context garbage collection for LLM agents, powered by Jev (TypeSafe AI's System One model)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Adi Gulalkari", email = "adigulalkari825@gmail.com" }
]
keywords = ["llm", "agents", "opentelemetry", "context-management", "jev", "typesafe", "langgraph", "token-optimization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2,<3",
    "httpx>=0.27,<1",
    "opentelemetry-api>=1.24,<2",
    "opentelemetry-sdk>=1.24,<2",
    "tenacity>=8.2,<9",
    "PyYAML>=6.0,<7",
    "cachetools>=5.3,<6",
]

[project.optional-dependencies]
langgraph = ["langgraph>=0.2"]
strands = ["strands-agents>=0.1"]
examples = ["strands-agents>=0.1", "mistralai>=1.0", "httpx>=0.27,<1"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "mypy>=1.9",
    "ruff>=0.4",
    "freezegun>=1.4",
    "types-PyYAML>=6.0",
]

[project.urls]
Homepage = "https://adigulalkari.github.io/Jev_GC/"
Documentation = "https://adigulalkari.github.io/Jev_GC/"
Repository = "https://github.com/adigulalkari/Jev_GC"
Issues = "https://github.com/adigulalkari/Jev_GC/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/jevgc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --cov=jevgc --cov-report=term-missing --cov-report=xml"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "N"]
ignore = ["E501"]

[tool.coverage.run]
source = ["src/jevgc"]
branch = true

[tool.coverage.report]
# Relaxed from an initial 85% target: tests focus on the modules with real
# decision logic (prefilter, policy, scorer, jev_client, store, config,
# integration pipeline) rather than chasing coverage on thin wrappers
# (telemetry, otel/translate, integrations/*).
fail_under = 50
show_missing = true
