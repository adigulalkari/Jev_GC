name: Bug report
description: Something behaved differently than the docs or SPEC.md say it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. The single most useful thing you can include is
        the `reason` string from the `GCDecision` that surprised you — together
        with your prefilter/policy settings it usually explains the behaviour
        outright.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did jev-gc do, and what did you expect instead?
    validations:
      required: true

  - type: textarea
    id: decision
    attributes:
      label: The decision that surprised you
      description: >
        If a span was kept or evicted unexpectedly, paste its `GCDecision` —
        `tier`, `treatment`, `relevance_score`, `confidence`, `used_jev`, and
        especially `reason`.
      render: text
    validations:
      required: false

  - type: textarea
    id: config
    attributes:
      label: Relevant configuration
      description: >
        Your `prefilter`, `policy` and `archive` settings. Redact your API key.
      render: yaml
    validations:
      required: false

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: >
        Smallest code that shows the problem. `FakeJevClient` reproductions are
        far easier to act on than ones needing a live API key — see
        `tests/integration/test_pipeline.py` for the pattern.
      render: python
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: jev-gc version or commit
      placeholder: "0.1.0, or a commit sha"
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version and OS
      placeholder: "3.11 on Ubuntu 24.04"
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I have removed any API keys and real span content from the above
          required: true
